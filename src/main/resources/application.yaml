spring:
  application:
    name: app
  jackson:
    time-zone: UTC
  datasource:
    hikari:
      pool-name: app-pool
      maximum-pool-size: 10
      connection-timeout: 10000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true
